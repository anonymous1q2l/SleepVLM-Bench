[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sleepvlm-bench"
version = "0.1.0"
description = "Auditable benchmark code for PSG sleep staging with general-purpose VLMs"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["sleep staging", "polysomnography", "vision-language models", "benchmark"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "matplotlib>=3.8,<4",
  "mne>=1.6,<2",
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.1,<3",
  "Pillow>=10,<12",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
  "tomli>=2,<3; python_version<'3.11'",
]

[project.optional-dependencies]
api = ["openai>=1.40,<2"]
local-vlm = [
  "accelerate>=0.33,<2",
  "torch>=2.2,<3",
  "transformers>=4.49,<5",
]
lora = [
  "peft>=0.13,<1",
  "torch>=2.2,<3",
  "transformers>=4.49,<5",
]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
sleepvlm = "sleepvlm_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
