[run]
task = "zero_shot_vlm"
manifest = "manifests/diagnostic_test.csv"
output_root = "outputs"
prompt_ids = ["image_only", "stage_features"]

[prompts]
image_only = "prompts/image_only.txt"
stage_features = "prompts/stage_features.txt"

[decoding]
temperature = 0.0
top_p = 1.0
max_new_tokens = 2048

# `paper_name` is display text. `model_id` is the actual callable model. A model must
# stay disabled until its immutable revision and backend smoke test are recorded.

[[models]]
paper_name = "GPT-4o"
backend = "openai_compatible"
model_id = "gpt-4o"
model_revision = ""
image_size = 336
api_key_env = "OPENAI_API_KEY"
enabled = false
verified = false

[[models]]
paper_name = "Gemma-3-27B-IT"
backend = "local_hf"
model_id = "google/gemma-3-27b-it"
model_revision = ""
image_size = 336
enabled = false
verified = false

[[models]]
